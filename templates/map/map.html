{% extends "layout/layout.html" %}
{% load static %}

{% block title %}Bản đồ tư vấn tuyển sinh{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/map.css' %}">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<style>
    /* --- PHẦN GIỮ NGUYÊN CỦA BẠN --- */
    .leaflet-routing-container, .leaflet-routing-error { display: none !important; }
    .popup-content { min-width: 250px; font-family: sans-serif; }
    .popup-img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
    .popup-title { font-weight: bold; color: #000000; font-size: 15px; margin-bottom: 5px; display: block; text-decoration: none; }
    .popup-info { font-size: 13px; line-height: 1.5; color: #333; }
    .popup-info b { color: #555; }
    .popup-link { color: #d93025; font-weight: bold; text-decoration: none; display: block; margin-top: 10px; padding-top: 8px; }
    .field:has(#major-chips) { background: rgba(255, 255, 255, 0.03); border-radius: 12px; padding: 15px; margin-top: 10px; }
    #major-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; max-height: 200px; overflow-y: auto; padding-right: 5px; margin-top: 10px; }
    #major-chips .chip { color: #000000; border: 1px solid #1a73e8; border-radius: 8px; padding: 8px 5px; font-size: 11px; font-weight: 600; text-align: center; cursor: pointer; transition: all 0.2s; }
    .popup-route-btn { display: inline-block; margin-top: 10px; padding: 8px 12px; border-radius: 8px; border: none; background: #0d6efd; color: white; cursor: pointer; font-size: 13px; font-weight: 600; width: 100%; }

    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,0.08); border-color: #1a73e8; }
    .card__title { font-weight: 700; color: #1f2937; }
    .card__meta { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
    #real-map { width: 100%; height: 100%; min-height: 650px; z-index: 1; }

    /* --- PHẦN THÊM ĐỂ HIỆN DANH SÁCH (KHÔNG ĐỔI LOGIC) --- */
    .filter {
        display: flex;
        flex-direction: column;
        height: 100vh; /* Cố định chiều cao sidebar */
        overflow: hidden;
    }

  .filter__inputs-wrapper {
        flex-shrink: 0; 
        max-height: 60vh; /* Bộ lọc tối đa chiếm 60% màn hình */
        overflow-y: auto;
        padding: 15px;
    
    }
    
    .tab__panel--active {
        max-height: 350px; /* Giới hạn chiều cao bộ lọc */
        overflow-y: auto;
    }

    /* Vùng kết quả: Tự động chiếm diện tích còn lại và hiện danh sách */
    .result {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-top: 2px solid #1a73e8;
     
    }

    .result__list {
        flex-grow: 1;
        overflow-y: auto; /* Tạo thanh cuộn riêng cho danh sách trường */
        padding: 15px;
    }

    .result__head {
        padding: 10px 15px;
        
        display: flex;
        justify-content: space-between;
        align-items: center;
        
    }

    @media (max-width: 480px) { #major-chips { grid-template-columns: repeat(2, 1fr); } }
</style>
{% endblock %}

{% block content %}
<div class="map-ui">
    <aside class="filter">
        <div class="filter__head">
            <h2>🧭 Bộ lọc thông minh</h2>
            <p>Tìm vị trí, chọn ngành và xem điểm chuẩn trực tiếp.</p>
        </div>

        <div class="field">
            <label>🏠 Vị trí của bạn</label>
            <div id="geocoder-input"></div>
        </div>

        <div class="filter__tabs">
            <button type="button" class="tab tab--active" id="tab-need-btn">🎯 Thông tin</button>
            <button type="button" class="tab" id="tab-space-btn">🌍 Khoảng cách</button>
        </div>

        <div class="tab__panel tab__panel--active" id="tab-need">
            <div class="field"><label>🔎 Tên trường</label><input id="kw" type="text" placeholder="Tìm tên trường..." /></div>
            <div class="field"><label>📍 Tỉnh/Thành</label><select id="city"><option value="">-- Tất cả --</option></select></div>
            <div class="field"><label>🧮 Khối xét tuyển</label><select id="khoi"><option value="">-- Tất cả --</option></select></div>
            <div class="field"><label>📊 Điểm của bạn</label><input id="score" type="number" step="0.1" placeholder="Nhập điểm bạn có..." /></div>
            <div class="field"><label>🧩 Ngành quan tâm</label><div class="chips" id="major-chips"></div></div>
        </div>

        <div class="tab__panel" id="tab-space" hidden>
            <div class="field"><label>📌 Bán kính (km)</label><input id="near" type="number" placeholder="VD: 20" /></div>
            <div class="field">
                <label>📏 Sắp xếp</label>
                <select id="sortdist">
                    <option value="nearest">Gần nhất trước</option>
                </select>
            </div>
        </div>

        <div class="filter__actions">
            <button type="button" class="btn btn--primary" id="btn-apply">Áp dụng</button>
            <button type="button" class="btn btn--ghost" id="btn-reset">Làm mới</button>
            <button type="button" class="btn btn--ghost" id="btn-clear-route">Xóa tuyến đường</button>
        </div>

        <div class="result" id="result-box">
            <div class="result__head">
                <h3 style="margin:0; font-size: 16px;">📌 Kết quả</h3>
                <span class="badge" id="result-count" style="background: #1a73e8; color: white; padding: 2px 8px; border-radius: 10px;">0</span>
            </div>
            <div class="result__list" id="result-list">
                </div>
        </div>
    </aside>

    <main class="map">
        <div class="map__top">
            <div class="map__title"><h1>🗺️ Bản đồ Tuyển sinh</h1></div>
            <div class="map__tools">
                <button type="button" class="tool" id="btn-my-location">📍 GPS</button>
            </div>
        </div>
        <section class="map__frame">
            <div id="real-map"></div>
        </section>
    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>
(function () {
    const API_URL = "{% url 'map_data_api' %}";
    let allSchools = [];
    let selectedMajor = "";
    let userLocation = { lat: 10.7769, lng: 106.7009 };
    let map, markerLayer, userMarker = null, routingControl = null;

    function getETA(km) {
        const mins = (km / 35) * 60;
        return mins < 60 ? Math.round(mins) + " phút" : Math.floor(mins / 60) + "h " + Math.round(mins % 60) + "p";
    }

    function initMap() {
        const voyager = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", { attribution: "© CartoDB" });
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });
        
        map = L.map("real-map", {
            center: [userLocation.lat, userLocation.lng],
            zoom: 12,
            layers: [voyager]
        });

        const baseMaps = { "🎨 Mặc định": voyager, "🛰️ Vệ tinh": satellite };
        markerLayer = L.layerGroup().addTo(map);
        L.control.layers(baseMaps, { "📍 Trường học": markerLayer }).addTo(map);

        const geocoder = L.Control.geocoder({ defaultMarkGeocode: false, placeholder: "Nhập địa chỉ..." })
            .on("markgeocode", function (e) {
                userLocation = e.geocode.center;
                drawUserMarker();
                map.setView(userLocation, 14);
                applyFilters();
            });
        
        document.getElementById("geocoder-input").appendChild(geocoder.onAdd(map));
        drawUserMarker();
    }

    function drawUserMarker() {
        if (userMarker) map.removeLayer(userMarker);
        const redIcon = new L.Icon({
            iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png",
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });
        userMarker = L.marker([userLocation.lat, userLocation.lng], { icon: redIcon }).addTo(map).bindPopup("Vị trí của bạn");
    }

    window.drawRoute = function(destLat, destLng) {
        if (routingControl) map.removeControl(routingControl);
        routingControl = L.Routing.control({
            waypoints: [L.latLng(userLocation.lat, userLocation.lng), L.latLng(destLat, destLng)],
            lineOptions: { styles: [{ color: "#0d6efd", weight: 6 }] },
            addWaypoints: false,
            show: false,
            createMarker: function() { return null; }
        }).addTo(map);
    };

    function buildPopup(s, dist) {
        const detailUrl = `/truong/${s.matruong}/`;
        const eta = getETA(dist);
        const maxDiem = (s.diem_chuan && s.diem_chuan.length > 0) ? Math.max(...s.diem_chuan.map(d => Number(d.diem) || 0)) : "---";

        return `
            <div class="popup-content">
                <a href="${detailUrl}"><img src="${s.image_url || ''}" class="popup-img" onerror="this.src='https://placehold.co/600x400?text=No+Image'"></a>
                <a href="${detailUrl}" class="popup-title">🏫 ${s.tentruong}</a>
                <div class="popup-info">
                    <b>📏 Khoảng cách:</b> ${dist.toFixed(2)} km<br>
                    <b>⏱️ Thời gian đi:</b> ~${eta}<br>
                    <b>📊 Điểm cao nhất:</b> <span style="color:red; font-weight:bold">${maxDiem}</span>
                </div>
                <button class="popup-route-btn" onclick="window.drawRoute(${s.lat}, ${s.lng})">🚗 Vẽ đường đi</button>
                <a href="${detailUrl}" class="popup-link">Xem chi tiết trường →</a>
            </div>`;
    }

    function applyFilters() {
        const kw = document.getElementById("kw").value.toLowerCase().trim();
        const city = document.getElementById("city").value;
        const userScore = parseFloat(document.getElementById("score").value || 0);
        const selKhoi = document.getElementById("khoi").value;
        const nearKm = parseFloat(document.getElementById("near").value || 0);

        let filtered = allSchools.filter(s => {
            const matchKw = !kw || s.tentruong.toLowerCase().includes(kw);
            const matchCity = !city || s.tinh_thanh === city;
            const matchMajor = !selectedMajor || (s.nganh_hoc && s.nganh_hoc.includes(selectedMajor));
            const matchScore = !userScore || (s.diem_chuan && s.diem_chuan.some(d => parseFloat(d.diem) <= userScore));
            const matchKhoi = !selKhoi || (s.khoi_xet_tuyen && s.khoi_xet_tuyen.includes(selKhoi));
            
            s._dist = L.latLng(userLocation.lat, userLocation.lng).distanceTo([s.lat, s.lng]) / 1000;
            const matchNear = !nearKm || s._dist <= nearKm;

            return matchKw && matchCity && matchMajor && matchScore && matchKhoi && matchNear;
        });

        filtered.sort((a, b) => a._dist - b._dist);
        
        markerLayer.clearLayers();
        const list = document.getElementById("result-list");
        list.innerHTML = "";
        document.getElementById("result-count").textContent = filtered.length;

        filtered.forEach(s => {
            const m = L.marker([s.lat, s.lng]).addTo(markerLayer).bindPopup(buildPopup(s, s._dist));
            
            const item = document.createElement("div");
            item.className = "card";
            item.innerHTML = `<div class="card__title">${s.tentruong}</div><div class="card__meta">${s._dist.toFixed(2)} km - ~${getETA(s._dist)}</div>`;
            item.onclick = () => {
                map.setView([s.lat, s.lng], 15);
                m.openPopup();
            };
            list.appendChild(item);
        });
    }

    initMap();

    fetch(API_URL).then(r => r.json()).then(data => {
        allSchools = data.schools || [];
        data.cities?.forEach(c => document.getElementById("city").add(new Option(c, c)));
        data.blocks?.forEach(b => document.getElementById("khoi").add(new Option(b, b)));

        const majorWrap = document.getElementById("major-chips");
        data.majors?.slice(0, 15).forEach(m => {
            const btn = document.createElement("button");
            btn.className = "chip"; btn.textContent = m;
            btn.onclick = () => {
                if (btn.classList.contains("active")) {
                    btn.classList.remove("active"); selectedMajor = "";
                } else {
                    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
                    btn.classList.add("active"); selectedMajor = m;
                }
                applyFilters();
            };
            majorWrap.appendChild(btn);
        });
        applyFilters();
    });

    document.getElementById("btn-apply").onclick = applyFilters;
    document.getElementById("btn-reset").onclick = () => location.reload();
    document.getElementById("btn-clear-route").onclick = () => routingControl && map.removeControl(routingControl);
    document.getElementById("btn-my-location").onclick = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                userLocation = { lat: p.coords.latitude, lng: p.coords.longitude };
                drawUserMarker(); map.setView(userLocation, 13);
                applyFilters();
            });
        }
    };

    document.getElementById("tab-need-btn").onclick = function() {
        this.classList.add("tab--active"); document.getElementById("tab-space-btn").classList.remove("tab--active");
        document.getElementById("tab-need").hidden = false; document.getElementById("tab-space").hidden = true;
    };
    document.getElementById("tab-space-btn").onclick = function() {
        this.classList.add("tab--active"); document.getElementById("tab-need-btn").classList.remove("tab--active");
        document.getElementById("tab-space").hidden = false; document.getElementById("tab-need").hidden = true;
    };
})();
</script>
{% endblock %}
