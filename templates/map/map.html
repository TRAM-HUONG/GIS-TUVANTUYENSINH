{% extends "layout/layout.html" %}
{% load static %}

{% block title %}Bản đồ tư vấn tuyển sinh{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/map.css' %}">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
<style>
    /* Style cho Popup chi tiết */
    .popup-content { min-width: 250px; font-family: sans-serif; }
    .popup-img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
    .popup-title { font-weight: bold; color: #0056b3; font-size: 15px; margin-bottom: 5px; display: block; text-decoration: none; }
    .popup-info { font-size: 13px; line-height: 1.5; color: #333; }
    .popup-info b { color: #555; }
    .popup-link { color: #d93025; font-weight: bold; text-decoration: none; display: block; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
    
    /* Chips ngành học */
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .chip { padding: 5px 12px; border-radius: 15px; background: #e8f0fe; border: 1px solid #ccc; font-size: 12px; cursor: pointer; }
    .chip.active { background: #1a73e8; color: white; border-color: #1a73e8; }
</style>
{% endblock %}

{% block content %}
<div class="map-ui">
    <aside class="filter">
        <div class="filter__head">
            <h2>🧭 Bộ lọc thông minh</h2>
            <p>Tìm vị trí, chọn ngành và xem điểm chuẩn trực tiếp.</p>
        </div>

        <div class="field">
            <label>🏠 Vị trí của bạn</label>
            <div id="geocoder-input"></div>
        </div>

        <div class="filter__tabs">
            <button type="button" class="tab tab--active" id="tab-need-btn">🎯 Thông tin</button>
            <button type="button" class="tab" id="tab-space-btn">🌍 Khoảng cách</button>
        </div>

        <div class="tab__panel tab__panel--active" id="tab-need">
            <div class="field"><label>🔎 Tên trường</label><input id="kw" type="text" placeholder="Tìm tên trường..." /></div>
            <div class="field"><label>📍 Tỉnh/Thành</label><select id="city"><option value="">-- Tất cả --</option></select></div>
            <div class="field"><label>🧮 Khối xét tuyển</label><select id="khoi"><option value="">-- Tất cả --</option></select></div>
            <div class="field"><label>📊 Điểm tối thiểu</label><input id="score" type="number" step="0.1" placeholder="VD: 20.5" /></div>
            <div class="field"><label>🧩 Ngành quan tâm</label><div class="chips" id="major-chips"></div></div>
        </div>

        <div class="tab__panel" id="tab-space" hidden>
            <div class="field"><label>📌 Bán kính (km)</label><input id="near" type="number" /></div>
            <div class="field"><label>📏 Sắp xếp</label><select id="sortdist"><option value="nearest">Gần nhất trước</option></select></div>
        </div>

        <div class="filter__actions">
            <button type="button" class="btn btn--primary" id="btn-apply">Áp dụng</button>
            <button type="button" class="btn btn--ghost" id="btn-reset">Làm mới</button>
        </div>

        <div class="result" id="result-box">
            <div class="result__head"><h3>📌 Kết quả</h3> <span class="badge" id="result-count">0</span></div>
            <div class="result__list" id="result-list"></div>
        </div>
    </aside>

    <main class="map">
        <div class="map__top">
            <div class="map__title"><h1>🗺️ Bản đồ Tuyển sinh</h1></div>
            <div class="map__tools"><button type="button" class="tool" id="btn-my-location">📍 GPS</button></div>
        </div>
        <section class="map__frame"><div id="real-map"></div></section>
    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
(function () {
    const API_URL = "{% url 'map_data_api' %}";
    let allSchools = [], selectedMajor = "", userLocation = { lat: 10.7769, lng: 106.7009 };
    let map, markerLayer, userMarker = null;

    // Hàm tính thời gian di chuyển ước tính (giả định tốc độ 35km/h)
    function getETA(km) {
        const mins = (km / 35) * 60;
        return mins < 60 ? Math.round(mins) + " phút" : Math.floor(mins/60) + "h " + Math.round(mins%60) + "p";
    }

    function initMap() {
        map = L.map('real-map').setView([userLocation.lat, userLocation.lng], 12);
        
        // SỬA LỖI 403: Dùng CartoDB Voyager thay cho OSM mặc định
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© CartoDB'
        }).addTo(map);

        markerLayer = L.layerGroup().addTo(map);

        // Geocoder tìm địa chỉ
        const control = L.Control.geocoder({ defaultMarkGeocode: false, placeholder: "Nhập địa chỉ của bạn..." })
            .on('markgeocode', function(e) {
                userLocation = e.geocode.center;
                drawUserMarker();
                map.setView(userLocation, 14);
            }).addTo(map);
        document.getElementById('geocoder-input').appendChild(control.onAdd(map));

        drawUserMarker();
    }

    function drawUserMarker() {
        if (userMarker) map.removeLayer(userMarker);
        const redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });
        userMarker = L.marker([userLocation.lat, userLocation.lng], {icon: redIcon}).addTo(map).bindPopup("Vị trí của bạn");
    }

    function buildPopup(s, dist) {
        // SỬA LỖI 404: Đường dẫn chuẩn theo image_6a797e.png
        const detailUrl = `/truong/${s.matruong}/`; 
        const eta = getETA(dist);
        const nganhHoc = s.nganh_hoc ? s.nganh_hoc.slice(0, 3).join(", ") + "..." : "Đang cập nhật";
        const khoi = s.khoi_xet_tuyen ? s.khoi_xet_tuyen.join(", ") : "Đang cập nhật";
        const diem = (s.diem_chuan && s.diem_chuan.length > 0) ? Math.max(...s.diem_chuan.map(d => d.diem)) : "---";

        return `
            <div class="popup-content">
                <a href="${detailUrl}"><img src="${s.image_url || ''}" class="popup-img"></a>
                <a href="${detailUrl}" class="popup-title">🏫 ${s.tentruong}</a>
                <div class="popup-info">
                    <b>📏 Khoảng cách:</b> ${dist.toFixed(2)} km<br>
                    <b>⏱️ Thời gian đi:</b> ~${eta}<br>
                    <b>📊 Điểm cao nhất:</b> <span style="color:red; font-weight:bold">${diem}</span><br>
                    <b>🧮 Khối:</b> ${khoi}<br>
                    <b>🧩 Ngành tiêu biểu:</b> ${nganhHoc}
                </div>
                <a href="${detailUrl}" class="popup-link">Chuyển đến trang trường →</a>
            </div>`;
    }

    function renderMarkers(data) {
        markerLayer.clearLayers();
        data.forEach(s => {
            const dist = L.latLng(userLocation).distanceTo([s.lat, s.lng]) / 1000;
            const m = L.marker([s.lat, s.lng]).addTo(markerLayer);
            m.bindPopup(buildPopup(s, dist));
            s._dist = dist;
        });
    }

    function applyFilters() {
        const kw = document.getElementById("kw").value.toLowerCase();
        const city = document.getElementById("city").value;
        const minScore = parseFloat(document.getElementById("score").value || 0);
        const selKhoi = document.getElementById("khoi").value;

        let filtered = allSchools.filter(s => {
            const matchKw = !kw || s.tentruong.toLowerCase().includes(kw);
            const matchCity = !city || s.tinh_thanh === city;
            const matchMajor = !selectedMajor || (s.nganh_hoc && s.nganh_hoc.includes(selectedMajor));
            const matchScore = !minScore || (s.diem_chuan && s.diem_chuan.some(d => d.diem >= minScore));
            const matchKhoi = !selKhoi || (s.khoi_xet_tuyen && s.khoi_xet_tuyen.includes(selKhoi));
            return matchKw && matchCity && matchMajor && matchScore && matchKhoi;
        });

        renderMarkers(filtered);
        
        // Cập nhật danh sách kết quả bên trái
        const list = document.getElementById("result-list");
        list.innerHTML = "";
        document.getElementById("result-count").textContent = filtered.length;
        document.getElementById("result-box").classList.add("show");

        filtered.forEach(s => {
            const item = document.createElement("div");
            item.className = "card";
            item.innerHTML = `<div class="card__title">${s.tentruong}</div><div class="card__meta">${s._dist.toFixed(2)} km - ~${getETA(s._dist)}</div>`;
            item.onclick = () => map.setView([s.lat, s.lng], 15);
            list.appendChild(item);
        });
    }

    initMap();

    fetch(API_URL).then(r => r.json()).then(data => {
        allSchools = data.schools || [];
        
        // Đổ dữ liệu vào các select
        const citySel = document.getElementById("city");
        data.cities?.forEach(c => citySel.add(new Option(c, c)));
        
        const khoiSel = document.getElementById("khoi");
        data.blocks?.forEach(b => khoiSel.add(new Option(b, b)));

        const majorWrap = document.getElementById("major-chips");
        data.majors?.slice(0, 10).forEach(m => {
            const btn = document.createElement("button");
            btn.className = "chip"; btn.textContent = m;
            btn.onclick = () => {
                document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
                if (selectedMajor === m) selectedMajor = "";
                else { selectedMajor = m; btn.classList.add("active"); }
            };
            majorWrap.appendChild(btn);
        });

        renderMarkers(allSchools);
    });

    document.getElementById("btn-apply").onclick = applyFilters;
    document.getElementById("btn-reset").onclick = () => location.reload();
    document.getElementById("btn-my-location").onclick = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                userLocation = { lat: p.coords.latitude, lng: p.coords.longitude };
                drawUserMarker(); map.setView(userLocation, 13);
            });
        }
    };
})();
</script>
{% endblock %}
