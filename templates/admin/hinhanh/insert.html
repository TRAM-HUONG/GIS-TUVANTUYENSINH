{% extends 'layout/layout.html' %}
{% load static %} 

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/insert.css' %}">
    
{% endblock %}

{% block content %}
<div class="insert-container">
    <h2>Thêm Hình Ảnh Mới</h2>

    <div class="main-row">
        <div class="form-column">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="fw-bold">Trường Đại Học</label>
                    <select name="matruong" required>
                        <option value="">-- Chọn trường --</option>
                        {% for t in dstruong %}
                        <option value="{{ t.matruong }}">{{ t.tentruong }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Tên mô tả file</label>
                    <input type="text" name="tenfile" placeholder="Ví dụ: Cổng trường, Thư viện...">
                </div>
                    <div class="mb-3">
                    <label class="fw-bold">Chọn các hình ảnh</label>
                    <input type="file" name="hinhanh" id="imgInput" accept="image/*" multiple required>
                    <small class="text-muted">Bạn có thể chọn nhiều ảnh cùng lúc.</small>
                </div>
                <button type="submit" class="btn-save">TẢI ẢNH LÊN</button>
                <a href="{% url 'admin_hinhanh_list' %}" class="btn btn-light w-100 mt-2" style="border-radius:var(--r14); display:block; text-align:center; padding:12px; text-decoration:none;">
                    Hủy bỏ
                </a>
            </form>
        </div>

        <div class="map-column">
            <div id="map">
                <img id="preview" src="#" alt="Preview"
                     style="display:none; width:100%; height:100%; object-fit:cover; border-radius:var(--r20);">
                <div id="placeholder"
                     style="height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; color:#666; text-align:center;">
                    <i class="fas fa-image fa-3x mb-2"></i>
                    <p>Hình ảnh xem trước sẽ hiện ở đây</p>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
    document.getElementById('imgInput').onchange = function (evt) {
        const files = evt.target.files;
        const placeholder = document.getElementById('placeholder');
        const mapColumn = document.querySelector('.map-column #map');
        
        // Xóa các ảnh preview cũ nếu có
        const oldPreviews = mapColumn.querySelectorAll('.preview-item');
        oldPreviews.forEach(img => img.remove());

        if (files.length > 0) {
            placeholder.style.display = 'none';
            Array.from(files).forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'preview-item';
                img.style = "width:100px; height:100px; object-fit:cover; margin:5px; border-radius:8px;";
                mapColumn.appendChild(img);
            });
        } else {
            placeholder.style.display = 'flex';
        }
    };
</script>
{% endblock %}
