{% extends 'layout/layout.html' %}
{% load static %} 

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/edit.css' %}">
{% endblock %}
{% block content %}
<div class="insert-container">
    <h2>Cập Nhật Hình Ảnh</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label>Mã hình ảnh</label>
            <input type="text" value="{{ hinhanh.mahinh_truong }}" readonly>
        </div>

        <div class="mb-3">
            <label>Thuộc Trường Đại Học</label>
            <select name="matruong" required>
                {% for t in dstruong %}
                <option value="{{ t.matruong }}" {% if t.matruong == hinhanh.matruong.matruong %}selected{% endif %}>
                    {{ t.tentruong }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label>Tiêu đề / Ghi chú</label>
            <input type="text" name="tenfile" value="{{ hinhanh.tieude|default:'' }}" placeholder="Ví dụ: Thư viện, Ký túc xá...">
        </div>

        <div class="mb-3">
            <label>Thay đổi hình ảnh (Để trống nếu giữ nguyên)</label>
            <input type="file" name="hinhanh" id="imgInput" accept="image/*">
            <small class="text-muted">Ảnh hiện tại: {{ hinhanh.tenfile }}</small>
        </div>

        <div class="mb-3">
            <label>Xem trước ảnh hiện tại</label><br>
            {% if hinhanh.tenfile %}
                <img id="preview"
                     src="{% static 'img/TDH/'|add:hinhanh.tenfile %}"
                     alt="Preview Image"
                     style="max-width: 100%; max-height: 320px; border-radius: 12px; margin-top: 10px;">
            {% else %}
                <img id="preview"
                     src=""
                     alt="Preview Image"
                     style="display:none; max-width: 100%; max-height: 320px; border-radius: 12px; margin-top: 10px;">
                <p id="placeholder" class="text-muted" style="margin-top:10px;">Chưa có ảnh</p>
            {% endif %}
        </div>

        <button type="submit">CẬP NHẬT DỮ LIỆU</button>
        <a href="{% url 'admin_hinhanh_list' %}">HỦY</a>
    </form>
</div>

<script>
    const imgInput = document.getElementById('imgInput');
    const preview = document.getElementById('preview');
    const placeholder = document.getElementById('placeholder');

    if (imgInput) {
        imgInput.onchange = function (evt) {
            const file = evt.target.files[0];
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
                if (placeholder) {
                    placeholder.style.display = 'none';
                }
            }
        };
    }
</script>
{% endblock %}
