{% extends 'layout/layout.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* Toàn bộ nền trang */
        .page-wrapper {
            background-color: #f0f2f5;
            min-height: 100vh;
            padding: 50px 20px;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .insert-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Tiêu đề */
        .insert-container h2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 30px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-row {
            padding: 40px;
        }

        /* Form styling */
        .mb-3 {
            margin-bottom: 25px;
        }

        .fw-bold {
            display: block;
            margin-bottom: 10px;
            color: #4a5568;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Input & Select */
        select, input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
            background-color: #f8fafc;
        }

        select:focus, input[type="text"]:focus {
            border-color: #667eea;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        /* Vùng chọn file chuyên nghiệp */
        .file-upload-wrapper {
            position: relative;
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            background: #f8fafc;
            cursor: pointer;
        }

        .file-upload-wrapper:hover {
            border-color: #667eea;
            background: #edf2ff;
        }

        input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 40px;
            color: #a0aec0;
            margin-bottom: 10px;
        }

        /* Khu vực xem trước ảnh */
        #preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .preview-item {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Nút Submit */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(118, 75, 162, 0.4);
            filter: brightness(1.1);
        }

        .btn-submit:active {
            transform: translateY(0);
        }
    </style>
{% endblock %}

{% block content %}
<div class="page-wrapper">
    <div class="insert-container">
        <h2><i class="fas fa-images me-2"></i> Thêm Hình Ảnh Ngành Mới</h2>
        
        <div class="main-row">
            <div class="form-column">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="fw-bold">Ngành Học Áp Dụng</label>
                        <select name="manganh" required>
                            <option value="">-- Click để chọn ngành --</option>
                            {% for n in ds_nganh %}
                                <option value="{{ n.manganh }}">{{ n.tennganh }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold">Tiêu đề / Mô tả ảnh</label>
                        <input type="text" name="tenfile" placeholder="Ví dụ: Hoạt động sinh viên, Cơ sở vật chất...">
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold">Tải ảnh lên</label>
                        <div class="file-upload-wrapper" id="drop-area">
                            <i class="fas fa-cloud-upload-alt upload-icon"></i>
                            <p id="file-count" style="margin:0; color: #718096;">Kéo thả ảnh vào đây hoặc click để chọn</p>
                            <input type="file" name="hinhanh" id="imgInput" accept="image/*" multiple required>
                        </div>
                        <div id="preview-container"></div>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fas fa-paper-plane me-2"></i> TẢI LÊN NGAY
                    </button>
                    
                    <div class="text-center mt-4">
                        <a href="javascript:history.back()" style="color: #a0aec0; text-decoration: none; font-size: 0.9rem;">
                            <i class="fas fa-arrow-left me-1"></i> Quay lại trang trước
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const imgInput = document.getElementById('imgInput');
    const previewContainer = document.getElementById('preview-container');
    const fileCountText = document.getElementById('file-count');

    imgInput.addEventListener('change', function() {
        previewContainer.innerHTML = ''; // Clear preview cũ
        const files = this.files;
        
        if (files.length > 0) {
            fileCountText.innerHTML = `Đã chọn <b>${files.length}</b> ảnh`;
            fileCountText.style.color = '#667eea';
            
            // Tạo preview cho từng ảnh
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.classList.add('preview-item');
                    previewContainer.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        } else {
            fileCountText.innerText = 'Kéo thả ảnh vào đây hoặc click để chọn';
            fileCountText.style.color = '#718096';
        }
    });

    // Hiệu ứng khi kéo file vào vùng drop
    const dropArea = document.getElementById('drop-area');
    ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => {
            dropArea.style.borderColor = '#667eea';
            dropArea.style.background = '#edf2ff';
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => {
            dropArea.style.borderColor = '#cbd5e0';
            dropArea.style.background = '#f8fafc';
        }, false);
    });
</script>
{% endblock %}
