<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sửa Trường Đại Học</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 400px; width: 100%; border-radius: 10px; margin-top: 10px; border: 2px solid #007bff; }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { padding: 10px 20px; border-radius: 5px; color: white; border: none; cursor: pointer; }
        .btn-primary { background-color: #007bff; }
    </style>
</head>
<body>
    <h2>Chỉnh sửa: {{ truong.tentruong }}</h2>

    <form method="POST">
        <div class="form-group">
            <label>Tên Trường</label>
            <input type="text" name="tentruong" class="form-control" value="{{ truong.tentruong }}">
        </div>

        <div class="form-group">
            <label>Vị trí hiện tại (Kéo Marker hoặc Click để đổi vị trí)</label>
            <div id="map"></div>
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="form-group">
                <label>Vĩ độ</label>
                <input type="text" id="lat" name="lat" class="form-control" value="{{ truong.lat|default:'' }}" readonly>
            </div>
            <div class="form-group">
                <label>Kinh độ</label>
                <input type="text" id="lng" name="lng" class="form-control" value="{{ truong.lng|default:'' }}" readonly>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Cập nhật thay đổi</button>
    </form>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Lấy tọa độ từ database, nếu không có thì để mặc định TP.HCM
        var savedLat = {{ truong.lat|default:10.762622 }};
        var savedLng = {{ truong.lng|default:106.660172 }};

        var map = L.map('map').setView([savedLat, savedLng], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Tạo marker có thể kéo (draggable)
        var marker = L.marker([savedLat, savedLng], {draggable: true}).addTo(map);

        function updateFields(lat, lng) {
            document.getElementById('lat').value = lat.toFixed(6);
            document.getElementById('lng').value = lng.toFixed(6);
        }

        // Khi người dùng kéo Marker
        marker.on('dragend', function(event) {
            var position = marker.getLatLng();
            updateFields(position.lat, position.lng);
        });

        // Khi người dùng click vào điểm khác trên bản đồ
        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            updateFields(e.latlng.lat, e.latlng.lng);
        });
    </script>
</body>
</html>
