{% extends 'layout/layout.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 500px; border-radius: 20px;">
        <div class="card-body text-center p-5">
            <div class="text-danger mb-4"><i class="fas fa-trash-alt fa-4x"></i></div>
            <h3>Xóa lựa chọn này?</h3>
            <p class="text-muted">Bạn đang xóa lựa chọn: <br>
                <strong class="text-dark">"{{ luachon.noidunglc }}"</strong>
            </p>
            <p class="small text-secondary">Câu hỏi liên quan: {{ luachon.maks.cauhoi }}</p>
            
            <form method="post" class="mt-4">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">XÁC NHẬN XÓA</button>
                <a href="{% url 'admin_luachon_list' %}" class="btn btn-light w-100 mt-2">Quay lại</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
