{% extends 'layout/layout.html' %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/insert.css' %}">{% endblock %}

{% block content %}
<div class="insert-container">
    <h2>Thêm Mới Câu Hỏi Khảo Sát</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Nội dung câu hỏi</label>
            <textarea name="cauhoi" rows="4" class="form-control" style="width:100%; border-radius:10px; padding:10px;" required placeholder="Nhập nội dung câu hỏi khảo sát tại đây...">{{ cauhoi|default:'' }}</textarea>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary w-100 py-2" style="border-radius: 10px; font-weight: bold;">LƯU DỮ LIỆU</button>
            <a href="{% url 'admin_khaosat_list' %}" class="btn btn-link w-100 text-muted mt-2">HỦY BỎ</a>
        </div>
    </form>
</div>
{% endblock %}
