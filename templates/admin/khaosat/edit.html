{% extends 'layout/layout.html' %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/edit.css' %}">{% endblock %}

{% block content %}
<div class="insert-container">
    <h2>Cập Nhật Câu Hỏi Khảo Sát</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label>Mã câu hỏi (Không thể sửa)</label>
            <input type="text" value="{{ khaosat.maks }}" readonly style="background-color: #f0f0f0; border: 1px solid #ddd; width: 100%; padding: 10px; border-radius: 10px;">
        </div>

        <div class="mb-3">
            <label>Nội dung câu hỏi</label>
            <textarea name="cauhoi" rows="5" required 
                style="width: 100%; border: 1px solid #ccc; border-radius: 12px; padding: 15px;">{{ khaosat.cauhoi }}</textarea>
        </div>

        <button type="submit" class="btn-submit" style="width: 100%; padding: 12px; background: #ffc107; border: none; border-radius: 10px; font-weight: bold;">CẬP NHẬT DỮ LIỆU</button>
        <a href="{% url 'admin_khaosat_list' %}" class="btn-cancel" 
           style="display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none;">HỦY BỎ</a>
    </form>
</div>
{% endblock %}
