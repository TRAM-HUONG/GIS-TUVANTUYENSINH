{% extends 'layout/layout.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="fas fa-list-check me-2"></i>Danh sách câu hỏi khảo sát</h4>
            <a href="{% url 'admin_khaosat_insert' %}" class="btn btn-light btn-sm fw-bold">+ THÊM CÂU HỎI</a>
        </div>
        <div class="card-body">
            <form method="get" class="row g-2 mb-3">
                <div class="col-auto">
                    <input type="text" name="keyword" value="{{ keyword }}" class="form-control" placeholder="Tìm nội dung câu hỏi...">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-secondary">Tìm</button>
                </div>
            </form>

            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Mã</th>
                        <th>Nội dung câu hỏi</th>
                        <th class="text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    {% for ks in ds_cauhoi %}
                    <tr>
                        <td><span class="badge bg-secondary">{{ ks.maks }}</span></td>
                        <td><strong>{{ ks.cauhoi }}</strong></td>
                        <td class="text-center">
                            <a href="{% url 'admin_khaosat_detail' ks.maks %}" class="btn btn-info btn-sm text-white"><i class="fas fa-eye"></i></a>
                            <a href="{% url 'admin_khaosat_edit' ks.maks %}" class="btn btn-warning btn-sm text-white"><i class="fas fa-edit"></i></a>
                            <a href="{% url 'admin_khaosat_delete' ks.maks %}" class="btn btn-danger btn-sm" onclick="return confirm('Xóa câu hỏi này?')"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
