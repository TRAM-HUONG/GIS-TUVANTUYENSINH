{% extends 'layout/layout.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 550px; border-radius: 20px;">
        <div class="card-body text-center p-5">
            <div class="text-danger mb-4">
                <i class="fas fa-exclamation-circle fa-4x"></i>
            </div>
            <h3>Xác nhận xóa câu hỏi?</h3>
            <p class="text-muted">Bạn đang thực hiện xóa câu hỏi: <br>
                <strong class="text-dark">"{{ khaosat.cauhoi }}"</strong>
            </p>
            <div class="alert alert-warning small">
                <i class="fas fa-info-circle"></i> Lưu ý: Hành động này không thể hoàn tác. Mọi dữ liệu trả lời liên quan đến câu hỏi này cũng sẽ bị xóa.
            </div>

            <form method="post" class="mt-4">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-5 py-2 fw-bold" style="border-radius: 10px;">XÓA VĨNH VIỄN</button>
                <div class="mt-3">
                    <a href="{% url 'admin_khaosat_list' %}" class="text-decoration-none text-muted">Hủy bỏ và quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
